[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantgold"
version = "0.1.0"
description = "QuantGold — modular XAUUSD/XAGUSD quantitative research and selective signal platform"
readme = "QUANTGOLD_README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "QuantGold" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
ml = [
  "xgboost>=2.1",
  "lightgbm>=4.0",
  "catboost>=1.2",
]
mt5 = [
  "MetaTrader5>=5.0.5572",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
include = ["quantgold*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
